- name: Check for composer.json
  id: composer-check
  run: |
    if [ -f composer.json ]; then
      echo "composer=true" >> "$GITHUB_OUTPUT"
    else
      echo "composer=false" >> "$GITHUB_OUTPUT"
      echo "No composer.json found in repository root; skipping Composer steps."
    fi

- name: Validate composer.json and composer.lock
  if: steps.composer-check.outputs.composer == 'true'
  run: composer validate --strict
